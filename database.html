<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>mcbCode DB Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0c0c0c;
      color: #bebebe;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* login screen */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
    }

    .login-box {
      background: #141414;
      border: 1px solid #2e2e2e;
      padding: 32px;
      width: 320px;
      text-align: center;
    }

    .login-box h2 { color: #05ee93; margin-bottom: 20px; font-size: 18px; }

    .login-box input {
      width: 100%;
      background: #0c0c0c;
      border: 1px solid #2e2e2e;
      color: #fff;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
    }

    .login-box input:focus { border-color: #05ee93; }

    .login-box button {
      width: 100%;
      background: #05ee93;
      border: none;
      color: #0c0c0c;
      padding: 9px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .login-box button:hover { background: #00c97a; }
    .login-err { color: #ff5555; font-size: 12px; margin-top: 10px; display: none; }

    /* main layout */
    #app { display: none; flex: 1; overflow: hidden; flex-direction: column; }

    .topbar {
      background: #141414;
      border-bottom: 1px solid #1f1f1f;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .topbar h1 { font-size: 15px; color: #05ee93; }
    .topbar span { color: #444; font-size: 12px; }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* sidebar */
    .sidebar {
      width: 180px;
      background: #111;
      border-right: 1px solid #1f1f1f;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .sidebar-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #444;
      padding: 12px 12px 4px;
    }

    .table-item {
      padding: 7px 12px;
      cursor: pointer;
      color: #888;
      font-size: 12px;
      border-left: 3px solid transparent;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .table-item:hover { background: #1a1a1a; color: #fff; }
    .table-item.active { background: #1a1a1a; color: #05ee93; border-left-color: #05ee93; }

    /* main panel */
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* sql bar */
    .sql-bar {
      background: #141414;
      border-bottom: 1px solid #1f1f1f;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      flex-shrink: 0;
    }

    .sql-bar textarea {
      flex: 1;
      background: #0c0c0c;
      border: 1px solid #2e2e2e;
      color: #fff;
      padding: 7px 10px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      min-height: 60px;
      max-height: 200px;
      outline: none;
      line-height: 1.5;
    }

    .sql-bar textarea:focus { border-color: #05ee93; }

    .sql-bar button {
      background: #05ee93;
      border: none;
      color: #0c0c0c;
      padding: 7px 14px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      align-self: flex-end;
    }

    .sql-bar button:hover { background: #00c97a; }

    .sql-meta {
      font-size: 11px;
      color: #444;
      padding: 4px 12px;
      background: #0e0e0e;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
      min-height: 20px;
    }

    .sql-meta.err { color: #ff5555; }
    .sql-meta.ok  { color: #05ee93; }

    /* table */
    .table-wrap {
      flex: 1;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead { position: sticky; top: 0; z-index: 10; }

    th {
      background: #1a1a1a;
      color: #05ee93;
      padding: 7px 10px;
      text-align: left;
      border-bottom: 1px solid #2e2e2e;
      border-right: 1px solid #1f1f1f;
      white-space: nowrap;
      font-weight: normal;
    }

    td {
      padding: 6px 10px;
      border-bottom: 1px solid #141414;
      border-right: 1px solid #111;
      color: #bebebe;
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    tr:hover td { background: #121212; }

    td.null-val { color: #444; font-style: italic; }
    td.num-val  { color: #5599ff; }
    td.str-val  { color: #ffcc66; }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-box">
      <h2>mcbCode Admin</h2>
      <input type="password" id="secret-input" placeholder="Admin secret" autocomplete="off">
      <button onclick="doLogin()">Enter</button>
      <div class="login-err" id="login-err">Wrong secret.</div>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="topbar">
      <h1>mcbCode DB Admin</h1>
      <span id="topbar-info">mcbcode-auth</span>
      <span style="margin-left:auto; cursor:pointer; color:#555;" onclick="doLogout()">sign out</span>
    </div>
    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-label">Tables</div>
        <div id="table-list"></div>
      </div>
      <div class="panel">
        <div class="sql-bar">
          <textarea id="sql-input" placeholder="SELECT * FROM users LIMIT 10;" spellcheck="false"></textarea>
          <button onclick="runQuery()">Run</button>
        </div>
        <div class="sql-meta" id="sql-meta"></div>
        <div class="table-wrap" id="table-wrap">
          <div class="empty-state">Select a table or run a query.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ← change this to your mcbdb worker url once deployed
    const WORKER = "https://mcbdb.mcbcode.com";

    let SECRET = "";
    let activeTable = null;

    // login
    async function doLogin() {
      const s = document.getElementById("secret-input").value.trim();
      if (!s) return;

      // verify by hitting /tables
      try {
        const res = await fetch(`${WORKER}/tables`, {
          headers: { "X-Admin-Secret": s }
        });
        if (!res.ok) {
          document.getElementById("login-err").style.display = "block";
          return;
        }
        const data = await res.json();
        SECRET = s;
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("app").style.display = "flex";
        renderTableList(data.tables);
      } catch {
        document.getElementById("login-err").textContent = "Could not reach worker.";
        document.getElementById("login-err").style.display = "block";
      }
    }

    function doLogout() {
      SECRET = "";
      document.getElementById("login-screen").style.display = "flex";
      document.getElementById("app").style.display = "none";
      document.getElementById("secret-input").value = "";
      document.getElementById("login-err").style.display = "none";
    }

    document.getElementById("secret-input").addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });

    // sidebar
    function renderTableList(tables) {
      const list = document.getElementById("table-list");
      list.innerHTML = "";
      tables.forEach(name => {
        const el = document.createElement("div");
        el.className = "table-item";
        el.textContent = name;
        el.onclick = () => loadTable(name, el);
        list.appendChild(el);
      });
    }

    async function loadTable(name, el) {
      document.querySelectorAll(".table-item").forEach(i => i.classList.remove("active"));
      el.classList.add("active");
      activeTable = name;
      document.getElementById("sql-input").value = `SELECT * FROM "${name}" LIMIT 100;`;
      setMeta("", "");

      try {
        const res = await fetch(`${WORKER}/table?name=${encodeURIComponent(name)}`, {
          headers: { "X-Admin-Secret": SECRET }
        });
        const data = await res.json();
        if (!res.ok) return setMeta(data.error, "err");
        renderTable(data.rows);
        setMeta(`${data.rows.length} row(s) — ${name}`, "ok");
      } catch (e) {
        setMeta("Fetch error: " + e.message, "err");
      }
    }

    // sql runner
    async function runQuery() {
      const sql = document.getElementById("sql-input").value.trim();
      if (!sql) return;
      setMeta("Running...", "");

      try {
        const res = await fetch(`${WORKER}/query`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Admin-Secret": SECRET
          },
          body: JSON.stringify({ sql })
        });
        const data = await res.json();

        if (!res.ok) return setMeta(data.error, "err");

        const rows = data.results || [];
        renderTable(rows);

        const changes = data.meta?.changes ?? null;
        if (rows.length > 0) {
          setMeta(`${rows.length} row(s) returned`, "ok");
        } else if (changes !== null) {
          setMeta(`Query ok — ${changes} row(s) affected`, "ok");
        } else {
          setMeta("Query ok — no rows returned", "ok");
        }
      } catch (e) {
        setMeta("Fetch error: " + e.message, "err");
      }
    }

    // ctrl+enter to run
    document.getElementById("sql-input").addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        runQuery();
      }
    });

    // render table
    function renderTable(rows) {
      const wrap = document.getElementById("table-wrap");
      if (!rows || rows.length === 0) {
        wrap.innerHTML = '<div class="empty-state">No rows returned.</div>';
        return;
      }

      const cols = Object.keys(rows[0]);
      let html = "<table><thead><tr>";
      cols.forEach(c => { html += `<th>${escHtml(c)}</th>`; });
      html += "</tr></thead><tbody>";

      rows.forEach(row => {
        html += "<tr>";
        cols.forEach(c => {
          const val = row[c];
          if (val === null || val === undefined) {
            html += `<td class="null-val">NULL</td>`;
          } else if (typeof val === "number") {
            html += `<td class="num-val">${escHtml(String(val))}</td>`;
          } else {
            const str = String(val);
            // truncate long values for display
            const display = str.length > 120 ? str.slice(0, 120) + "…" : str;
            html += `<td class="str-val" title="${escHtml(str)}">${escHtml(display)}</td>`;
          }
        });
        html += "</tr>";
      });

      html += "</tbody></table>";
      wrap.innerHTML = html;
    }

    function setMeta(text, type) {
      const el = document.getElementById("sql-meta");
      el.textContent = text;
      el.className = "sql-meta" + (type ? " " + type : "");
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;")
        .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
  </script>
</body>
</html>
